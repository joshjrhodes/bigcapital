# ─────────────────────────────────────────────────────────────────────────────
# RPW overlay — layered on top of the upstream `docker-compose.prod.yml`.
#
# Purpose: run *this fork's* code instead of the published `bigcapitalhq/*`
# images, so custom RPW modules (branded PDF templates, sales-tax scaffolding,
# CRM, …) actually end up in the running containers.
#
# This file is host-agnostic on purpose: it must run unchanged on the laptop,
# on a VPS, and later on Josh's own hardware. Anything host-specific belongs in
# `.env` or the git-ignored `docker-compose.override.yml`.
#
# Usage (COMPOSE_FILE in .env already wires this up):
#   docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Object storage for attachments ──────────────────────────────────────────
  # Upstream stores attachments (logos, bills of sale, receipts) only in
  # S3-compatible object storage — there is no local-disk driver. MinIO gives us
  # that inside the compose file: one container, one named volume, no third
  # party holding RPW's documents, and it moves hosts with everything else.
  # Roughly 150 MB of RAM, which the ~4 GB target host can afford.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: rpw-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio:/data
    expose:
      - '9000'
      - '9001'
    restart: on-failure
    networks:
      - bigcapital_network
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 12

  # Creates the bucket on first boot, then exits. Re-running is harmless.
  minio_init:
    image: minio/mc:latest
    container_name: rpw-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
    entrypoint:
      - sh
      - -c
      - >
        mc alias set rpw http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        (mc ls "rpw/$$S3_BUCKET" >/dev/null 2>&1 || mc mb "rpw/$$S3_BUCKET") &&
        echo "bucket $$S3_BUCKET ready"
    networks:
      - bigcapital_network

  server:
    image: rpw/server:local
    build:
      context: ./
      dockerfile: packages/server/Dockerfile
    environment:
      # Not passed through by the upstream prod compose file, but read by the app.
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - THROTTLE_GLOBAL_TTL=${THROTTLE_GLOBAL_TTL}
      - THROTTLE_GLOBAL_LIMIT=${THROTTLE_GLOBAL_LIMIT}
      - THROTTLE_AUTH_TTL=${THROTTLE_AUTH_TTL}
      - THROTTLE_AUTH_LIMIT=${THROTTLE_AUTH_LIMIT}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY}
      - POSTHOG_HOST=${POSTHOG_HOST}
      # MinIO speaks S3 but has no DNS-style buckets, so path-style addressing
      # is required — without it every upload 404s against a hostname that
      # does not exist.
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
    depends_on:
      - minio

  webapp:
    image: rpw/webapp:local
    build:
      context: ./
      dockerfile: packages/webapp/Dockerfile

  # Upstream builds this from `docker/migration/Dockerfile`, which is
  # `FROM bigcapitalhq/server:latest` — i.e. it would migrate using *upstream's*
  # migrations, not ours. Reuse the server image we just built instead.
  database_migration:
    image: rpw/server:local
    build: !reset null
    working_dir: /app/packages/server
    command:
      - sh
      - -c
      - >
        for i in $$(seq 1 60); do
          node dist/cli.js system:migrate:latest && break;
          echo "database not ready yet (attempt $$i), retrying in 5s...";
          sleep 5;
        done;
        node dist/cli.js tenants:migrate:latest

volumes:
  minio:
    name: rpw_minio
