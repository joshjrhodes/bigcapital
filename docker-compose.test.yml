# ─────────────────────────────────────────────────────────────────────────────
# Disposable verification stack.
#
# Same images and same wiring as the real stack, but on its own port and its own
# volumes, so `rpw/scripts/verify_stack.sh` can create dummy invoices, prove the
# migrations run from scratch, and then throw the whole thing away without ever
# touching the real books.
#
# Never point this at the production volumes: the volume names below MUST differ
# from the ones in docker-compose.prod.yml, which are fixed names that ignore the
# compose project prefix.
#
#   COMPOSE_FILE=docker-compose.prod.yml:docker-compose.rpw.yml:docker-compose.test.yml \
#     docker compose -p rpwtest up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  proxy:
    container_name: rpwtest-proxy
    ports: !override
      - '127.0.0.1:${RPW_TEST_PORT:-8081}:80'

  server:
    container_name: rpwtest-server
    environment:
      # A scratch stack must never be reachable by anything that matters, and
      # the smoke test needs to be able to register its own account.
      - SIGNUP_DISABLED=false
      # No real mail credentials in a scratch stack. The smoke test signs up
      # fake addresses (smoke-test@…), and with the real SMTP password
      # inherited from .env their welcome mails went out through Josh's actual
      # Zoho account and bounced. Empty by default; make_sample_pdfs.sh passes
      # the real values through ONLY when an email test is explicitly asked for.
      - MAIL_HOST=${RPW_TEST_MAIL_HOST:-}
      - MAIL_PORT=${RPW_TEST_MAIL_PORT:-}
      - MAIL_SECURE=${RPW_TEST_MAIL_SECURE:-}
      - MAIL_USERNAME=${RPW_TEST_MAIL_USERNAME:-}
      - MAIL_PASSWORD=${RPW_TEST_MAIL_PASSWORD:-}
      - MAIL_FROM_NAME=${RPW_TEST_MAIL_FROM_NAME:-}
      - MAIL_FROM_ADDRESS=${RPW_TEST_MAIL_FROM_ADDRESS:-}

  webapp:
    container_name: rpwtest-webapp

  mysql:
    container_name: rpwtest-mysql
    volumes: !override
      - mysql:/var/lib/mysql

  redis:
    container_name: rpwtest-redis
    volumes: !override
      - redis:/data

  minio:
    container_name: rpwtest-minio
    volumes: !override
      - minio:/data

  minio_init:
    container_name: rpwtest-minio-init

  database_migration:
    container_name: rpwtest-database-migration

volumes:
  mysql:
    name: rpwtest_mysql
  redis:
    name: rpwtest_redis
  # Without this the scratch stack would write test attachments straight into
  # the real object store — the volume names in the base files are fixed and
  # ignore the compose project prefix.
  minio:
    name: rpwtest_minio
